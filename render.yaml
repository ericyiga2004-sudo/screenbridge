# Test service. Free instances can sleep; upgrade to always-on for live sessions.
services:
  - type: web
    name: screenbridge-api
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: npm start -w @screenbridge/api
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: WEB_ORIGIN
        sync: false
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
